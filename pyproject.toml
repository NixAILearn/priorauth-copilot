[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "priorauth-copilot"
version = "0.1.0"
description = "Non-commercial demo: AI utilization-review copilot for a fictional health plan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "httpx2>=2.13",
    "pydantic>=2.7",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates: long literal lines read better unwrapped.
"generator/core.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]
