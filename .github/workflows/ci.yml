name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests, code scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Scan for licensed code sets (CPT, CDT, UB-04)
        run: python scripts/scan_codes.py

      - name: Generated cases still match their specs (D-036, D-039)
        run: python -m generator check

      # Safety gate only, on the oracle backend: no key, no cost (D-006, D-056). Exit 1 if a
      # false approve-ready, a denial value or a missed injection appears.
      - name: Smoke eval, safety gate (10 cases)
        run: make eval-smoke
